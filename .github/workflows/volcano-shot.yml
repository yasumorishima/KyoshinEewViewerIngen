name: volcano-shot

# fork 専用。PR #218 の説明用スクリーンショットを実アプリ (Xvfb) で撮る。
# 仮想シリアルポート経由で QZQSM センテンスを流し込むので、アプリ側は無改造。
# ライト/ダークの両テーマを 1 回の run で撮る。
on:
  push:
    branches: [ screenshot/volcano-shot ]
  workflow_dispatch:
    inputs:
      memo:
        description: '実行意図'
        required: true

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y xvfb socat imagemagick x11-utils psmisc

    - name: Build
      run: dotnet build -c Release src/KyoshinEewViewer.Desktop/KyoshinEewViewer.Desktop.csproj

    - name: Write config
      run: |
        mkdir -p ~/.config/KyoshinEewViewer
        cat > ~/.config/KyoshinEewViewer/config.json <<'JSON'
        {
          "ShowWizard": false,
          "Theme": { "WindowTheme": { "Type": 0, "Identifier": "Light" } },
          "Qzss": {
            "Connect": true,
            "SerialPort": "/tmp/kevi_app",
            "BaudRate": 115200,
            "SetupSendSfrbx": false,
            "SetupSendRmc": false,
            "SetupEnableQzss": false,
            "SetupChangeUpdateRate": false
          },
          "Update": { "SendCrashReport": false },
          "Logging": { "Enable": true }
        }
        JSON
        cat ~/.config/KyoshinEewViewer/config.json

    - name: Make NMEA sentences
      run: |
        python3 - <<'PY'
        hexes = [
            ("volcano_hakone",  "53ADC51C200001C200B13B2BE3F00000000000000000000000000012270C7440"),
            ("volcano_shinmoe", "9AADC089B400009B40C22789F4691A17A00000000000000000000010FC738640"),
            ("volcano_aso",     "C6AD424130000412E341F783E0F10910421230200000000000000013417E39C0"),
            ("ashfall_aso",     "53AD4894CC80014C043EE4C1F07826122081309181098496F8000012AAAFCB40"),
            ("ashfall_sakura",  "53AD4DF194000718F23F46467F44323422C1519FD1098CFE8800001223D79E00"),
        ]
        with open("sentences.txt", "w") as f:
            for name, h in hexes:
                assert len(h) == 64 and h[-1] == "0", h
                body = f"QZQSM,53,{h[:63]}"
                cs = 0
                for c in body:
                    cs ^= ord(c)
                f.write(f"{name}\t$" + body + f"*{cs:02X}\n")
        print(open("sentences.txt").read())
        PY

    - name: Capture
      run: |
        set -x
        APP_PORT="/tmp/kevi_app"
        FEED_PORT="/tmp/kevi_feed"
        CFG="$HOME/.config/KyoshinEewViewer/config.json"
        mkdir -p shots
        Xvfb :99 -screen 0 1400x900x24 &
        export DISPLAY=:99
        sleep 3
        for THEME in Light Dark; do
          python3 - "$CFG" "$THEME" <<'PY'
        import json, sys
        path, theme = sys.argv[1], sys.argv[2]
        cfg = json.load(open(path))
        cfg["Theme"] = {"WindowTheme": {"Type": 0, "Identifier": theme}}
        json.dump(cfg, open(path, "w"), ensure_ascii=False, indent=2)
        print("theme ->", json.load(open(path))["Theme"])
        PY
          SUFFIX=""
          if [ "$THEME" = "Dark" ]; then SUFFIX="_dark"; fi
          socat -d -d "pty,raw,echo=0,link=$APP_PORT" "pty,raw,echo=0,link=$FEED_PORT" &
          SOCAT=$!
          sleep 3
          ls -l "$APP_PORT" "$FEED_PORT"
          dotnet src/KyoshinEewViewer.Desktop/bin/Release/net10.0/KyoshinEewViewer.Desktop.dll -s qzss -l > "shots/run$SUFFIX.log" 2>&1 &
          APP=$!
          sleep 60
          grep -c "Serial Error" "shots/run$SUFFIX.log" || true
          import -window root "shots/00_before$SUFFIX.png"
          while IFS=$'\t' read -r name sentence; do
            printf '%s\r\n' "$sentence" > "$FEED_PORT"
            sleep 6
            import -window root "shots/$name$SUFFIX.png"
            echo "captured $name$SUFFIX"
          done < sentences.txt
          kill -9 $APP 2>/dev/null || true
          pkill -9 -f KyoshinEewViewer.Desktop.dll || true
          kill -9 $SOCAT 2>/dev/null || true
          pkill -9 -x socat || true
          sleep 8
          rm -f "$APP_PORT" "$FEED_PORT"
          echo "--- run$SUFFIX.log (last 12) ---"
          tail -n 12 "shots/run$SUFFIX.log" || true
        done
        ls -la shots
        md5sum shots/*.png

    - name: Trim black margins
      run: |
        mogrify -fuzz 0 -trim +repage shots/*.png
        identify shots/*.png

    - name: Publish to screenshots branch
      run: |
        PUB=$(mktemp -d)
        cp shots/*.png "$PUB/" || true
        cp shots/*.log "$PUB/" || true
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch --orphan screenshots
        git rm -rf --cached . >/dev/null 2>&1 || true
        find . -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
        cp "$PUB"/* .
        git add -A
        git commit -m "volcano map layer screenshots light/dark (run ${GITHUB_RUN_ID})"
        git push -f origin screenshots
